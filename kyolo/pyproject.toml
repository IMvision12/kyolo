[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyolo"
version = "0.1.0"
description = "A pure Keras 3 implementation of the YOLO object-detection family (v5, v6, v7, v8, v9, v10, 11, 12, 26) with PyTorch weight-conversion utilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "kyolo contributors" }]
keywords = [
    "keras",
    "keras3",
    "yolo",
    "object-detection",
    "computer-vision",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies. Keras 3 is backend-agnostic; install one of
# tensorflow / jax / torch separately (see the optional backend extras below).
dependencies = [
    "keras>=3.5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# --- Backend choices (pick one) --------------------------------------------
tensorflow = ["tensorflow>=2.16"]
jax = ["jax>=0.4.28"]
torch = ["torch>=2.2", "torchvision>=0.17"]

# --- Weight conversion from the official PyTorch checkpoints ----------------
# `torch` is required to load the source .pt files; `ultralytics` is only
# needed to conveniently instantiate the reference models. The weights
# themselves are AGPL-3.0 and are NOT redistributed by this project.
convert = ["torch>=2.2", "ultralytics>=8.2.0"]

# --- Visualization / examples ----------------------------------------------
viz = ["matplotlib>=3.7", "pillow>=10.0"]

# --- Development -------------------------------------------------------------
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
]

# Everything, for a one-shot dev install.
all = [
    "kyolo[tensorflow,convert,viz,dev]",
]

[project.urls]
Homepage = "https://github.com/IMvision12/yolo-keras"
Repository = "https://github.com/IMvision12/yolo-keras"
Issues = "https://github.com/IMvision12/yolo-keras/issues"

[project.scripts]
kyolo-convert = "kyolo.conversion.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
