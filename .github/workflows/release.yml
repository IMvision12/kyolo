name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'kyolo/version.py'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      created: ${{ steps.create_release.outputs.created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -o '"[0-9]*\.[0-9]*\.[0-9]*"' kyolo/version.py | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Create release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${{ steps.get_version.outputs.version }}"
          if ! gh release view "$RELEASE_TAG" &>/dev/null; then
            gh release create "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --notes "Auto-generated release for version ${{ steps.get_version.outputs.version }}" \
              --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $RELEASE_TAG already exists, skipping creation."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

  pypi-publish:
    needs: create-release
    if: needs.create-release.outputs.created == 'true'
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
