name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test-code:
    name: Test (${{ matrix.backend }})
    needs: lint-and-format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, jax, torch]
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.backend }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.backend }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -U "keras>=3.5.0" pytest pytest-cov
          if [ "${{ matrix.backend }}" = "torch" ]; then
            # CPU-only torch wheel keeps the runner CUDA-free.
            pip install --index-url https://download.pytorch.org/whl/cpu torch
          elif [ "${{ matrix.backend }}" = "jax" ]; then
            pip install "jax[cpu]"
          else
            pip install "tensorflow-cpu>=2.16"
          fi
          pip install -e .  # brings in matplotlib + pillow (core deps)
      - name: Run tests
        run: |
          pytest tests/ -v --durations=20 --cov=kyolo -m "not slow and not gpu"
